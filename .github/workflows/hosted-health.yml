name: Hosted Suniye health
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: hosted-suniye-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check hosted reader without calling paid providers
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 90 \
            --output health.json https://suniye-reader.onrender.com/health
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('health.json').read_text())
          assert result['status'] == 'ok'
          capabilities = result['capabilities']
          for name in ['hindiSpeech', 'modelConfigured', 'preferenceSync', 'caregiverHelp']:
              assert capabilities[name] is True, f'{name} unavailable'
          assert capabilities['modelProvider'] == 'backboard'
          assert capabilities['model'] == 'google/gemma-3-4b-it'
          print(json.dumps(result))
          PY
